name: Performance Check

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        timeout-minutes: 10
        run: npm run build

      - name: Start preview server
        run: |
          npm run preview > /tmp/portfolio-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5174/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portfolio-preview.log
          exit 1
      
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            http://127.0.0.1:5174/
            http://127.0.0.1:5174/projects/
            http://127.0.0.1:5174/blog/
            http://127.0.0.1:5174/blog/ieee-r10-volunteer-award/
            http://127.0.0.1:5174/achievements/
            http://127.0.0.1:5174/press-kit/
            http://127.0.0.1:5174/gallery/
            http://127.0.0.1:5174/card/
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
